<!doctype html>
<!--
  地図の部品の E2E 用の一時のページ（T3-03）。ui が正式な MapView.tsx を作ったら、
  このファイル、src/views/mapProbe.ts、vite.config.ts の入力の追加、E2E の spec を見直す。
  利用者向けのページではない（アプリの入口は index.html）。
-->
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Relata map probe</title>
    <style>
      html,
      body {
        margin: 0;
      }
      /* 実際の .region-main と同じく container-type: size の枠の中に、絶対配置で地図を入れる。 */
      #frame {
        position: relative;
        width: 800px;
        height: 500px;
        container-type: size;
      }
      #map {
        position: absolute;
        inset: 0;
      }
      #message {
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <div id="frame"><div id="map" data-main-frame></div></div>
    <p id="message" role="status"></p>
    <script type="module" src="/src/views/mapProbe.ts"></script>
  </body>
</html>
