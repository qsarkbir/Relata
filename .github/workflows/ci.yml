# CI（継続的インテグレーション）: コードを push するたびに、機械が自動で検査する仕組み。
# 【なぜ】「手元では動いた」を防ぎ、まっさらな環境でも lint・型検査・テスト・E2E が通ることを毎回確かめる（NFR-11、設計書 §14）。
name: CI

on:
  # 【なぜ】PR で検査し、マージ前に不具合に気づくため。
  pull_request:
  # 【なぜ】全ブランチの push で動かす。タスクのブランチを push した時点で結果を確かめたいから。
  push:
  # 【なぜ】GitHub の画面から手動で実行できるようにする（原因調査や再確認のため）。
  workflow_dispatch:

# 【なぜ】同じブランチで新しい実行が始まったら古い実行を止める。待ち時間と実行枠の節約になる。
# 【なぜ】ただし main は止めない。main の実行には配信（deploy ジョブ）が含まれ、
# 配信の途中で止まると公開サイトが中途半端になりうるため。main では続けて push しても順に待つ。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# 【なぜ】既定の権限を「読み取りのみ」に絞る。万一ワークフローが悪用されても、書き込みができないようにする（最小権限）。
permissions:
  contents: read

jobs:
  # 【なぜ】1 ジョブにまとめる。ジョブを分けると、ジョブごとに npm ci と Node の準備をやり直すことになり、
  # このプロジェクトの規模では分割の利点（並列化）より無駄のほうが大きい。順に実行すれば、失敗した手順もログで一目でわかる。
  # 【なぜ】test は src/ に一時ファイルを書く層境界の検査を含むため、tsc や build と並列にならないよう、手順を直列に並べる。
  verify:
    name: 検査・テスト・E2E
    runs-on: ubuntu-latest
    # 【なぜ】固まった実行が無料枠を使い続けないよう、上限を付ける。
    timeout-minutes: 20
    env:
      # 【なぜ】E2E の webServer は build 済みの dist/ をそのまま配信するだけにする（下の build の二重回避を参照）。
      E2E_SKIP_BUILD: '1'
    steps:
      # 【なぜ】リポジトリのコードを、実行機に取り出す。
      - name: コードを取得
        uses: actions/checkout@v7

      # 【なぜ】.nvmrc を読んで手元と同じ Node の版にする。cache: npm で、依存パッケージのダウンロードを再利用して速くする。
      - name: Node.js を準備
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # 【なぜ】npm install ではなく npm ci。package-lock.json のとおりに、毎回同じ版を入れるため。
      - name: 依存パッケージを入れる
        run: npm ci

      # 【なぜ】コードの誤りや規約違反を、いちばん速い検査から先に見つける。
      - name: lint
        run: npm run lint

      - name: 書式の検査
        run: npm run format:check

      - name: 型検査
        run: npm run typecheck

      # 【なぜ】単体テスト（カバレッジ込み）。tsc や build と同時に走らせないので、ここで単独で実行する。
      - name: 単体テスト
        run: npm test

      # 【なぜ】本番と同じビルドが通ることを確かめる。ここで 1 回だけ build し、E2E ではこの dist/ を再利用する。
      - name: ビルド
        run: npm run build

      # 【なぜ】Playwright のブラウザ本体（数百 MB）の再ダウンロードを避ける。キーを Playwright の版にして、版が上がったら取り直す。
      - name: Playwright の版を調べる
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Playwright のブラウザをキャッシュ
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # 【なぜ】--with-deps で、ブラウザが動くのに必要な OS のライブラリも入れる。ブラウザがキャッシュ済みなら、本体は取得されない。
      - name: Chromium を入れる
        run: npx playwright install --with-deps chromium

      # 【なぜ】build の二重を避ける。playwright.config.ts は E2E_SKIP_BUILD があると build を省き、preview だけ起動する。
      - name: E2E テスト
        run: npm run test:e2e

      # 【なぜ】失敗の原因（画面の記録やトレース）を、あとから手元で見られるようにする。成功時は不要。キャンセル時も残さない。
      - name: E2E の記録を保存
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # 【なぜ】ビルド成果物を残す。下の deploy ジョブが、検査を通ったこの dist をそのまま配信に使うため。
      - name: dist を保存
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # 配信（デプロイ）: 検査を通った dist を GitHub Pages に公開する。公開先は https://qsarkbir.github.io/Relata/ 。
  #
  # 【注意】リポジトリの Settings → Pages → Source が「GitHub Actions」になっていないと、
  # main への push で、このジョブだけが失敗する（「Pages site not found」や 404 の旨のエラー）。
  # 検査（verify）の結果には影響しない。直し方: 上の設定を「GitHub Actions」にしてから、
  # Actions 画面で失敗した実行を開き「Re-run failed jobs」を押す（コードの修正は不要）。
  deploy:
    name: GitHub Pages に配信
    # 【なぜ】verify が成功したときだけ配信する。検査に落ちた版を公開しない。
    needs: verify
    # 【なぜ】main への push のときだけ配信する。PR や作業ブランチの試作を公開しないため。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 【なぜ】このジョブだけに書き込み権限を足す。pages: write は配信の実行、
    # id-token: write は「この実行は本当にこのリポジトリのものか」を GitHub に証明するために必要。
    # contents: read はジョブ単位の permissions を書くと外れるため、取得用に明記し直す。
    permissions:
      contents: read
      pages: write
      id-token: write
    # 【なぜ】公式の推奨どおり。配信は 1 本ずつ順に行い（group: pages）、実行中の配信は止めない（cancel-in-progress: false）。
    # 止めると公開サイトが中途半端になりうる。
    concurrency:
      group: pages
      cancel-in-progress: false
    # 【なぜ】github-pages 環境を使う。Actions 画面と利用者の画面に、公開先の URL と配信履歴が出る。
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 【なぜ】verify が保存した dist を取り出す。ここで build し直さないので、
      # 検査・E2E を通ったものと、公開するものが同一になる。
      - name: dist を取り出す
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # 【なぜ】Pages 用の形式（tar）に包んで保存する。deploy-pages は、この専用の artifact（名前 github-pages）だけを配信する。
      - name: 配信用の成果物を作る
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

      # 【なぜ】Pages に公開する。公開先の URL は、上の environment の url に渡される。
      - name: GitHub Pages に配信
        id: deployment
        uses: actions/deploy-pages@v5
